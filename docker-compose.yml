services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-41832}:41832"
    user: "${PUID:-1001}:${PGID:-1001}"
    init: true
    volumes:
      - type: bind
        source: ./docker-data/data
        target: /app/data
      - type: bind
        source: ./docker-data/public/uploads
        target: /app/public/uploads
      - type: bind
        source: ./docker-data/uploads_backup
        target: /app/uploads_backup
      - type: bind
        source: ./docker-data/public/line-arts
        target: /app/runtime-line-arts
      - type: bind
        source: ./docker-data/server/data
        target: /app/server/data
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 41832
      TZ: "${TZ:-Asia/Shanghai}"
      APP_UPLOADS_PATH: /app/public/uploads
      APP_UPLOADS_BACKUP_PATH: /app/uploads_backup
      APP_LINE_ARTS_PATH: /app/runtime-line-arts
      APP_SETTINGS_PATH: /app/server/data/settings.json
      APP_LINE_ART_HISTORY_PATH: /app/server/data/line-art-history.json
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:41832/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
