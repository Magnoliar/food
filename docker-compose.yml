services:
  app:
    build: .
    ports:
      - "41832:41832"
    user: "${PUID:-1001}:${PGID:-1001}"
    volumes:
      - ./docker-data/data:/app/data
      - ./docker-data/public/uploads:/app/public/uploads
      - ./docker-data/uploads_backup:/app/uploads_backup
      - ./docker-data/server/data:/app/server/data
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/dev.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:41832/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
