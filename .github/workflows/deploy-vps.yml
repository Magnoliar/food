name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: Absolute project path on the target server or NAS
        required: true
        default: /volume1/docker/food

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd "${{ inputs.deploy_path }}"
            git pull --ff-only
            docker compose config --quiet
            docker compose build --pull app
            docker compose up -d --no-deps --remove-orphans app

            attempts=0
            until docker compose exec -T app wget -qO- http://127.0.0.1:41832/api/health >/dev/null; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 45 ]; then
                docker compose logs --tail=200 app
                exit 1
              fi
              sleep 2
            done

            docker compose ps
