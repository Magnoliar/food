name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-32chars
      ADMIN_USER: ci-admin
      ADMIN_PASSWORD: ci-admin-password
      PARTNER_USER: ci-member
      PARTNER_PASSWORD: ci-partner-password

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm exec prisma generate

      - name: Apply migrations
        run: npm exec prisma migrate deploy

      - name: Seed database
        run: npm exec prisma db seed

      - name: Check mojibake
        run: npm run check:mojibake

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Export Docker fixture
        run: npm run export:docker-data

      - name: Smoke Docker runtime
        run: npm run docker:smoke
