name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-32chars
      ADMIN_PASSWORD: ci-admin-password
      PARTNER_PASSWORD: ci-partner-password

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Check mojibake
        run: npm run check:mojibake

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t food-ci .

      - name: Smoke Docker runtime
        run: |
          mkdir -p ci-docker-data
          cp dev.db ci-docker-data/dev.db
          container_id="$(docker run -d \
            --user 0:0 \
            -p 41834:41832 \
            -e DATABASE_URL=file:/app/data/dev.db \
            -e AUTH_SECRET=ci-auth-secret-ci-auth-secret-32chars \
            -e ADMIN_PASSWORD=ci-admin-password \
            -e PARTNER_PASSWORD=ci-partner-password \
            -v "$PWD/ci-docker-data:/app/data" \
            food-ci)"
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:41834/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
